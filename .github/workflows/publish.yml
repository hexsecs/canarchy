name: publish

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Publication target"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      # Fails the run before anything is built when publishing to PyPI from
      # anything but the release tag matching a final __version__. Dispatching
      # from the default `main` once uploaded a .dev build instead of the
      # release (issue #559), and PyPI never accepts a version twice.
      - name: Verify release ref
        env:
          PUBLISH_TARGET: ${{ inputs.repository }}
        run: python scripts/check_release_ref.py --target "$PUBLISH_TARGET"

      - name: Build distribution artifacts
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-testpypi:
    if: inputs.repository == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/canarchy/
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: inputs.repository == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/canarchy/
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
